<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testsite1</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: #0f172a; color: #e2e8f0;
    }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    h1 { font-size: 2rem; margin: 0 0 .5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    .badge {
      display: inline-block; margin-top: 1rem; padding: .35rem .75rem;
      border: 1px solid #334155; border-radius: 999px; font-size: .85rem;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Testsite1</h1>
    <p>This site is online and serving over HTTPS. Use it to verify domain
       ownership with your security scanner.</p>
    <span class="badge">status: ok</span>
  </main>
</body>
</html>
